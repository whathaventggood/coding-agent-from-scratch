[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent-from-scratch"
version = "0.1.0"
description = "A command-line coding agent with controlled local tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai==3.13.0",
    "httpx2[socks]==2.12.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
coding-agent = "cli:main"
coding-agent-evaluate = "evaluate_reports:main"
coding-agent-benchmark = "run_benchmark:main"

[tool.setuptools]
py-modules = [
    "agent_loop",
    "cli",
    "command_tool",
    "deepseek_model",
    "evaluate_reports",
    "file_tools",
    "main",
    "models",
    "run_benchmark",
]
